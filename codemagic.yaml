workflows:
  ios-sideload-ipa:
    name: FootIQ iOS (.ipa for Sideloadly / AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS Release (No Codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Runner.app into FootIQ.ipa
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 FootIQ.ipa Payload
    artifacts:
      - build/ios/ipa/FootIQ.ipa
