name: Mobil derleme (elle)

# Android APK ve imzasız iOS derlemesi yalnızca elle çalıştırılır:
# GitHub > Actions > "Mobil derleme (elle)" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      android:
        description: Android APK derlensin mi?
        type: boolean
        default: true
      ios:
        description: iOS (.ipa, imzasız) derlensin mi?
        type: boolean
        default: false

jobs:
  build-apk:
    name: FootIQ Android (APK)
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: FootIQ iOS (.ipa)
    if: ${{ inputs.ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package Runner.app into FootIQ.ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 FootIQ.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FootIQ-iOS-IPA
          path: build/ios/ipa/FootIQ.ipa
          if-no-files-found: error
