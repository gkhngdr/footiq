name: footiq
description: "FootIQ - Futbol bilgi yarışması oyunu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/figma/
    - assets/sounds/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
